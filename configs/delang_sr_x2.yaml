model: delang_sr_sd3_1024_x2
seed: 123
sd3_path: /path/to/stable-diffusion-3
fixed_prompt: ""
fixed_prompt_path: null

# Generated by scripts/build_rellisur_language_metadata.py and
# scripts/cache_delang_prompt_embeds.py.
metadata_path: ./metadata/rellisur_x2_train_lang.jsonl
prompt_embed_cache_path: ./metadata/rellisur_x2_train_prompt_embeds.pt
prompt_mode: prompt_instruction

vae_lora_rank: 96
transformer_lora_rank: 128

dinov3_convnext_size: large
dinov3_repo_path: ./third_party/dinov3
dinov3_weights_path: ./pretrained/dinov3_convnext_large_pretrain_lvd1689m-61fa432d.pth
lambda_LRR: 5
lambda_Dv3D: 5
lambda_L1: 0.7
lambda_sigma_prior: 0.2
lambda_freq_low: 0.5
lambda_freq_high: 0.5
lambda_attr: 0.1
mid_timestep: 700

sigma_min: 0.15
sigma_max: 0.95
sigma_base_channels: 32
num_degradation_tokens: 4
token_base_channels: 64
freq_kernel_size: 21
freq_kernel_sigma: 3.0
attribute_vector_dim: 7

prompt_dropout: 0.1

output_dir: ./experiments/delang_sr_x2
resolution: 1024
train_batch_size: 1
max_train_steps: 20000
checkpointing_steps: 1000
save_img_steps: 100
resume_from_checkpoint: null
gradient_accumulation_steps: 1
gradient_checkpointing: True
enable_xformers_memory_efficient_attention: False
learning_rate: 5e-5
lr_scheduler: constant
lr_warmup_steps: 500
lr_num_cycles: 1
lr_power: 1.0
dataloader_num_workers: 1
use_8bit_adam: False
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1e-4
adam_epsilon: 1e-08
max_grad_norm: 1.0
logging_dir: logs
allow_tf32: False
mixed_precision: bf16
